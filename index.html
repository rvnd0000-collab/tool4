<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-File Code Playground</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid #3498db;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .playground {
            display: flex;
            flex-direction: column;
            height: 70vh;
        }
        
        @media (min-width: 768px) {
            .playground {
                flex-direction: row;
            }
        }
        
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
        }
        
        .panel-header {
            background: #34495e;
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .code-editor {
            flex: 1;
            padding: 15px;
            background: #1e1e1e;
            overflow: auto;
        }
        
        textarea {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            resize: none;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.5;
            padding: 10px;
            border-radius: 5px;
        }
        
        textarea:focus {
            outline: 2px solid #3498db;
        }
        
        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #34495e;
            color: white;
        }
        
        .preview-container {
            flex: 1;
            padding: 15px;
            background: white;
            overflow: auto;
        }
        
        #preview {
            width: 100%;
            height: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
        }
        
        .controls {
            padding: 15px;
            background: #ecf0f1;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #bdc3c7;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        #run-btn {
            background: #2ecc71;
            color: white;
        }
        
        #run-btn:hover {
            background: #27ae60;
        }
        
        #clear-btn {
            background: #e74c3c;
            color: white;
        }
        
        #clear-btn:hover {
            background: #c0392b;
        }
        
        #save-btn {
            background: #3498db;
            color: white;
        }
        
        #save-btn:hover {
            background: #2980b9;
        }
        
        .example-select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #bdc3c7;
            background: white;
            font-weight: bold;
        }
        
        footer {
            text-align: center;
            padding: 15px;
            background: #2c3e50;
            color: white;
            font-size: 0.9rem;
        }
        
        .tab-buttons {
            display: flex;
            background: #2c3e50;
        }
        
        .tab-button {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: #34495e;
            color: #ecf0f1;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab-button.active {
            background: #3498db;
            color: white;
        }
        
        .tab-content {
            display: none;
            height: 100%;
        }
        
        .tab-content.active {
            display: flex;
            flex-direction: column;
        }
        
        .mobile-warning {
            display: none;
            background: #f39c12;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
        }
        
        @media (max-width: 767px) {
            .mobile-warning {
                display: block;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .playground {
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>One-File Code Playground</h1>
            <p class="subtitle">Write HTML, CSS, and JavaScript in one file and see the result instantly</p>
        </header>
        
        <div class="mobile-warning">
            Tip: On mobile, use landscape orientation for better coding experience
        </div>
        
        <div class="playground">
            <div class="editor-panel">
                <div class="panel-header">
                    <h2>Code Editor</h2>
                    <select class="example-select" id="example-select">
                        <option value="">Select Example</option>
                        <option value="counter">Counter App</option>
                        <option value="calculator">Calculator</option>
                        <option value="todo">Todo List</option>
                        <option value="clock">Digital Clock</option>
                    </select>
                </div>
                
                <div class="tab-buttons">
                    <button class="tab-button active" data-tab="html">HTML</button>
                    <button class="tab-button" data-tab="css">CSS</button>
                    <button class="tab-button" data-tab="js">JavaScript</button>
                </div>
                
                <div class="tab-content active" id="html-tab">
                    <div class="code-editor">
                        <textarea id="html-code" placeholder="Write your HTML here...">&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
    &lt;title&gt;My Playground App&lt;/title&gt;
    &lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;div id="app"&gt;
        &lt;h1&gt;Welcome to the Playground!&lt;/h1&gt;
        &lt;p&gt;Edit the code to see changes in real-time.&lt;/p&gt;
        &lt;button id="demo-btn"&gt;Click Me!&lt;/button&gt;
    &lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>
                    </div>
                </div>
                
                <div class="tab-content" id="css-tab">
                    <div class="code-editor">
                        <textarea id="css-code" placeholder="Write your CSS here...">body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    min-height: 100vh;
    margin: 0;
}

#app {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

h1 {
    margin-bottom: 20px;
    font-size: 2.5rem;
}

p {
    font-size: 1.2rem;
    margin-bottom: 30px;
}

#demo-btn {
    padding: 12px 24px;
    font-size: 1.1rem;
    background: #ff6b6b;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.3s;
}

#demo-btn:hover {
    background: #ff5252;
    transform: translateY(-2px);
}</textarea>
                    </div>
                </div>
                
                <div class="tab-content" id="js-tab">
                    <div class="code-editor">
                        <textarea id="js-code" placeholder="Write your JavaScript here...">document.getElementById('demo-btn').addEventListener('click', function() {
    alert('Hello from the playground!');
    
    // Change button text and color
    this.textContent = 'Clicked!';
    this.style.background = '#4ecdc4';
    
    // Reset after 1 second
    setTimeout(() => {
        this.textContent = 'Click Me!';
        this.style.background = '#ff6b6b';
    }, 1000);
});

// Add current time to the page
const timeElement = document.createElement('p');
timeElement.id = 'current-time';
document.getElementById('app').appendChild(timeElement);

function updateTime() {
    const now = new Date();
    timeElement.textContent = 'Current time: ' + now.toLocaleTimeString();
}

setInterval(updateTime, 1000);
updateTime();</textarea>
                    </div>
                </div>
            </div>
            
            <div class="preview-panel">
                <div class="preview-header">
                    <h2>Live Preview</h2>
                    <button id="refresh-btn">⟳ Refresh</button>
                </div>
                <div class="preview-container">
                    <iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button id="run-btn">Run Code</button>
            <button id="clear-btn">Clear Code</button>
            <button id="save-btn">Save Code</button>
        </div>
        
        <footer>
            <p>One-File Code Playground &copy; 2023 | Works on all devices</p>
        </footer>
    </div>

    <script>
        // DOM elements
        const htmlCode = document.getElementById('html-code');
        const cssCode = document.getElementById('css-code');
        const jsCode = document.getElementById('js-code');
        const preview = document.getElementById('preview');
        const runBtn = document.getElementById('run-btn');
        const clearBtn = document.getElementById('clear-btn');
        const saveBtn = document.getElementById('save-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const exampleSelect = document.getElementById('example-select');
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabContents = document.querySelectorAll('.tab-content');
        
        // Tab switching functionality
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const tabId = button.getAttribute('data-tab');
                
                // Remove active class from all buttons and contents
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));
                
                // Add active class to current button and content
                button.classList.add('active');
                document.getElementById(`${tabId}-tab`).classList.add('active');
            });
        });
        
        // Run code function
        function runCode() {
            const html = htmlCode.value;
            const css = `<style>${cssCode.value}</style>`;
            const js = `<script>${jsCode.value}<\/script>`;
            
            // Combine HTML, CSS, and JS into one document
            const combinedCode = html.replace('</head>', `${css}</head>`).replace('</body>', `${js}</body>`);
            
            // Write to iframe
            preview.contentDocument.open();
            preview.contentDocument.write(combinedCode);
            preview.contentDocument.close();
        }
        
        // Event listeners
        runBtn.addEventListener('click', runCode);
        refreshBtn.addEventListener('click', runCode);
        
        clearBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to clear all code?')) {
                htmlCode.value = '';
                cssCode.value = '';
                jsCode.value = '';
                runCode();
            }
        });
        
        saveBtn.addEventListener('click', () => {
            const blob = new Blob([`
<!DOCTYPE html>
<html>
<head>
<style>${cssCode.value}</style>
</head>
<body>
${htmlCode.value.replace('<!DOCTYPE html>', '').replace('<html>', '').replace('</html>', '').replace('<head>', '').replace('</head>', '').replace('<body>', '').replace('</body>', '')}
<script>${jsCode.value}<\/script>
</body>
</html>
            `], { type: 'text/html' });
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'playground-code.html';
            a.click();
            URL.revokeObjectURL(url);
        });
        
        // Example code templates
        const examples = {
            counter: {
                html: `<div id="app">
    <h1>Counter App</h1>
    <div id="counter">0</div>
    <button id="increment">+</button>
    <button id="decrement">-</button>
    <button id="reset">Reset</button>
</div>`,
                css: `body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    min-height: 100vh;
    margin: 0;
}

#app {
    max-width: 400px;
    margin: 50px auto;
    padding: 30px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

h1 {
    margin-bottom: 30px;
    font-size: 2.5rem;
}

#counter {
    font-size: 4rem;
    margin: 30px 0;
    font-weight: bold;
}

button {
    padding: 12px 24px;
    margin: 0 10px;
    font-size: 1.2rem;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: 2px solid white;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.3s;
}

button:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: translateY(-2px);
}`,
                js: `let count = 0;
const counterElement = document.getElementById('counter');
const incrementBtn = document.getElementById('increment');
const decrementBtn = document.getElementById('decrement');
const resetBtn = document.getElementById('reset');

function updateCounter() {
    counterElement.textContent = count;
    counterElement.style.color = count > 0 ? '#4ecdc4' : count < 0 ? '#ff6b6b' : 'white';
}

incrementBtn.addEventListener('click', () => {
    count++;
    updateCounter();
});

decrementBtn.addEventListener('click', () => {
    count--;
    updateCounter();
});

resetBtn.addEventListener('click', () => {
    count = 0;
    updateCounter();
});

updateCounter();`
            },
            calculator: {
                html: `<div id="app">
    <h1>Calculator</h1>
    <div id="display">0</div>
    <div id="buttons">
        <button class="btn clear">C</button>
        <button class="btn operator">/</button>
        <button class="btn operator">*</button>
        <button class="btn operator">-</button>
        
        <button class="btn number">7</button>
        <button class="btn number">8</button>
        <button class="btn number">9</button>
        <button class="btn operator">+</button>
        
        <button class="btn number">4</button>
        <button class="btn number">5</button>
        <button class="btn number">6</button>
        <button class="btn equals">=</button>
        
        <button class="btn number">1</button>
        <button class="btn number">2</button>
        <button class="btn number">3</button>
        <button class="btn number">0</button>
        
        <button class="btn decimal">.</button>
    </div>
</div>`,
                css: `body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    max-width: 300px;
    padding: 20px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

h1 {
    margin-bottom: 20px;
    font-size: 2rem;
}

#display {
    background: rgba(0, 0, 0, 0.2);
    padding: 15px;
    font-size: 2.5rem;
    text-align: right;
    border-radius: 5px;
    margin-bottom: 20px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    overflow: hidden;
}

#buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.btn {
    padding: 15px;
    font-size: 1.5rem;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.2s;
}

.btn:hover {
    background: rgba(255, 255, 255, 0.3);
}

.btn.operator {
    background: rgba(255, 107, 107, 0.7);
}

    background: rgba(78, 205, 196, 0.7);
    grid-row: span 2;
}

.btn.clear {
    background: rgba(231, 76, 60, 0.7);
}`,
                js: `let currentInput = '0';
let previousInput = '';
let operation = null;
const display = document.getElementById('display');

function updateDisplay() {
    display.textContent = currentInput;
}

function inputNumber(num) {
    if (currentInput === '0' || currentInput === 'Error') {
        currentInput = num;
    } else {
        currentInput += num;
    }
    updateDisplay();
}

function inputOperator(op) {
    if (currentInput === 'Error') return;
    
    if (operation !== null) {
        calculate();
    }
    previousInput = currentInput;
    currentInput = '';
    operation = op;
}

function inputDecimal() {
    if (currentInput === 'Error') return;
    
    if (!currentInput.includes('.')) {
        currentInput += '.';
        updateDisplay();
    }
}

function clear() {
    currentInput = '0';
    previousInput = '';
    operation = null;
    updateDisplay();
}

function calculate() {
    let computation;
    const prev = parseFloat(previousInput);
    const current = parseFloat(currentInput);
    
    if (isNaN(prev) || isNaN(current)) {
        currentInput = 'Error';
        updateDisplay();
        return;
    }
    
    switch (operation) {
        case '+':
            computation = prev + current;
            break;
        case '-':
            computation = prev - current;
            break;
        case '*':
            computation = prev * current;
            break;
        case '/':
            computation = prev / current;
            break;
        default:
            return;
    }
    
    currentInput = computation.toString();
    operation = null;
    previousInput = '';
    updateDisplay();
}

// Add event listeners to buttons
document.querySelectorAll('.btn').forEach(button => {
    button.addEventListener('click', () => {
        if (button.classList.contains('number')) {
            inputNumber(button.textContent);
        } else if (button.classList.contains('operator')) {
            inputOperator(button.textContent);
        } else if (button.classList.contains('decimal')) {
            inputDecimal();
        } else if (button.classList.contains('equals')) {
            calculate();
        } else if (button.classList.contains('clear')) {
            clear();
        }
    });
});

updateDisplay();`
            },
            // More examples would be added here
        };
        
        // Example selector
        exampleSelect.addEventListener('change', function() {
            const example = this.value;
            if (example && examples[example]) {
                htmlCode.value = examples[example].html;
                cssCode.value = examples[example].css;
                jsCode.value = examples[example].js;
                runCode();
            }
        });
        
        // Auto-run code on changes (with debounce)
        let timeout;
        function debounceRunCode() {
            clearTimeout(timeout);
            timeout = setTimeout(runCode, 1000);
        }
        
        htmlCode.addEventListener('input', debounceRunCode);
        cssCode.addEventListener('input', debounceRunCode);
        jsCode.addEventListener('input', debounceRunCode);
        
        // Initialize with default code
        runCode();
    </script>
</body>
</html>
